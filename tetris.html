<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2656200620663831"
       crossorigin="anonymous"></script>
  <title>테트리스 - 픽셀크래프트 스튜디오</title>
  <meta name="description" content="브라우저에서 바로 즐기는 클래식 테트리스입니다. 설치 없이 방향키만으로 플레이할 수 있습니다." />
  <meta name="keywords" content="테트리스, 브라우저 게임, 무료 온라인 게임, 미니 게임" />
  <link rel="canonical" href="https://pixelcraftstudio-2cd.pages.dev/tetris.html" />
  <link rel="alternate" hreflang="ko" href="https://pixelcraftstudio-2cd.pages.dev/tetris.html" />
  <link rel="alternate" hreflang="en" href="https://pixelcraftstudio-2cd.pages.dev/en/tetris.html" />
  <link rel="alternate" hreflang="x-default" href="https://pixelcraftstudio-2cd.pages.dev/tetris.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="픽셀크래프트 스튜디오" />
  <meta property="og:title" content="테트리스 - 픽셀크래프트 스튜디오" />
  <meta property="og:description" content="설치 없이 브라우저에서 바로 즐기는 클래식 테트리스." />
  <meta property="og:url" content="https://pixelcraftstudio-2cd.pages.dev/tetris.html" />
  <meta property="og:locale" content="ko_KR" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <h1>테트리스</h1>
      <p>
        떨어지는 블록을 쌓아 가로 줄을 가득 채우면 그 줄이 사라지는 클래식 퍼즐
        게임입니다. <a href="games.html">미니 게임 목록</a>으로 돌아가려면 이
        링크를 이용하세요.
      </p>
    </section>

    <div class="game-layout">
      <div class="tetris-board-wrap">
        <canvas id="tetris-board" width="240" height="480" aria-label="테트리스 보드"></canvas>
        <div id="tetris-overlay" class="game-overlay" hidden>
          <p id="tetris-overlay-text"></p>
          <button id="tetris-restart-btn" class="btn btn-primary" type="button">다시 시작</button>
        </div>
      </div>

      <div class="game-panel">
        <div class="game-stat-row">
          <div class="game-stat">
            <span class="game-stat-label">점수</span>
            <span id="tetris-score" class="game-stat-value">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">줄</span>
            <span id="tetris-lines" class="game-stat-value">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">레벨</span>
            <span id="tetris-level" class="game-stat-value">1</span>
          </div>
        </div>

        <div class="tetris-next-wrap">
          <span class="game-stat-label">다음 블록</span>
          <canvas id="tetris-next" width="96" height="96" aria-label="다음 블록 미리보기"></canvas>
        </div>

        <button id="tetris-pause-btn" class="btn btn-secondary" type="button">일시정지</button>

        <div class="tetris-touch-controls" aria-label="게임 조작 버튼">
          <button data-action="rotate" type="button" aria-label="회전">⟳</button>
          <button data-action="left" type="button" aria-label="왼쪽">◀</button>
          <button data-action="down" type="button" aria-label="아래로">▼</button>
          <button data-action="right" type="button" aria-label="오른쪽">▶</button>
          <button data-action="drop" type="button" aria-label="즉시 낙하">⤓</button>
        </div>

        <p class="game-controls-hint">← → 이동 · ↑ 회전 · ↓ 소프트 드롭 · Space 즉시 낙하 · P 일시정지</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/pixel-art.js"></script>
  <script src="js/background-characters.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tetris.js"></script>
</body>
</html>
