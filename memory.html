  <title>카드 짝 맞추기 - 픽셀크래프트 스튜디오</title>
  <meta name="description" content="픽셀크래프트 스튜디오의 픽셀 아이콘으로 즐기는 카드 짝 맞추기 메모리 게임입니다. 브라우저에서 바로 플레이할 수 있습니다." />
  <meta name="keywords" content="카드 짝 맞추기, 메모리 게임, 브라우저 게임, 무료 온라인 게임, 미니 게임" />

  <link rel="alternate" hreflang="ko" href="https://pixelcraftstudio-2cd.pages.dev/memory.html" />
  <link rel="alternate" hreflang="en" href="https://pixelcraftstudio-2cd.pages.dev/en/memory.html" />
  <link rel="alternate" hreflang="x-default" href="https://pixelcraftstudio-2cd.pages.dev/memory.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="픽셀크래프트 스튜디오" />
  <meta property="og:title" content="카드 짝 맞추기 - 픽셀크래프트 스튜디오" />
  <meta property="og:description" content="픽셀 아이콘으로 즐기는 카드 짝 맞추기 메모리 게임." />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <h1>카드 짝 맞추기</h1>
      <p>
        같은 그림의 카드 두 장을 찾아 짝을 맞추는 메모리 게임입니다. 카드
        그림은 픽셀크래프트 스튜디오의 오리지널 픽셀 아이콘을 사용합니다.
        <a href="games.html">미니 게임 목록</a>으로 돌아가려면 이 링크를
        이용하세요.
      </p>
    </section>

    <div class="game-layout">
      <div class="memory-board-wrap">
        <div id="memory-grid" class="memory-grid" aria-label="카드 짝 맞추기 보드"></div>
        <div id="memory-overlay" class="game-overlay" hidden>
          <p id="memory-overlay-text"></p>
        </div>
      </div>

      <div class="game-panel">
        <div class="game-stat-row">
          <div class="game-stat">
            <span class="game-stat-label">시도</span>
            <span id="memory-moves" class="game-stat-value">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">맞춘 짝</span>
            <span id="memory-matches" class="game-stat-value">0/8</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">시간</span>
            <span id="memory-time" class="game-stat-value">0:00</span>
          </div>
        </div>

        <button id="memory-restart-btn" class="btn btn-primary" type="button">새 게임</button>

        <p class="game-controls-hint">카드를 두 장씩 클릭해서 같은 그림을 찾아보세요.</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/pixel-art.js"></script>
  <script src="js/background-characters.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pixel-gallery-icons.js"></script>
  <script src="js/memory.js"></script>
</body>
</html>
