       crossorigin="anonymous"></script>
  <title>Tetris - PixelCraft Studio</title>
  <meta name="description" content="Play a classic Tetris clone right in your browser - no install required, just use the arrow keys." />
  <meta name="keywords" content="tetris, browser game, free online game, mini game" />
  <link rel="canonical" href="https://pixelcraftstudio-2cd.pages.dev/en/tetris.html" />
  <link rel="alternate" hreflang="ko" href="https://pixelcraftstudio-2cd.pages.dev/tetris.html" />
  <link rel="alternate" hreflang="en" href="https://pixelcraftstudio-2cd.pages.dev/en/tetris.html" />
  <link rel="alternate" hreflang="x-default" href="https://pixelcraftstudio-2cd.pages.dev/tetris.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PixelCraft Studio" />
  <meta property="og:title" content="Tetris - PixelCraft Studio" />
  <meta property="og:description" content="Play a classic Tetris clone right in your browser, no install required." />
  <meta property="og:url" content="https://pixelcraftstudio-2cd.pages.dev/en/tetris.html" />
  <meta property="og:locale" content="en_US" />

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <h1>Tetris</h1>
      <p>
        Stack falling blocks to fill a horizontal row and clear it - the
        classic puzzle game. Head back to the <a href="games.html">mini
        games list</a> any time.
      </p>
    </section>

    <div class="tetris-layout">
      <div class="tetris-board-wrap">
        <canvas id="tetris-board" width="240" height="480" aria-label="Tetris board"></canvas>
        <div id="tetris-overlay" class="tetris-overlay" hidden>
          <p id="tetris-overlay-text"></p>
          <button id="tetris-restart-btn" class="btn btn-primary" type="button">Restart</button>
        </div>
      </div>

      <div class="tetris-panel">
        <div class="tetris-stat-row">
          <div class="tetris-stat">
            <span class="tetris-stat-label">Score</span>
            <span id="tetris-score" class="tetris-stat-value">0</span>
          </div>
          <div class="tetris-stat">
            <span class="tetris-stat-label">Lines</span>
            <span id="tetris-lines" class="tetris-stat-value">0</span>
          </div>
          <div class="tetris-stat">
            <span class="tetris-stat-label">Level</span>
            <span id="tetris-level" class="tetris-stat-value">1</span>
          </div>
        </div>

        <div class="tetris-next-wrap">
          <span class="tetris-stat-label">Next</span>
          <canvas id="tetris-next" width="96" height="96" aria-label="Next piece preview"></canvas>
        </div>

        <button id="tetris-pause-btn" class="btn btn-secondary" type="button">Pause</button>

        <div class="tetris-touch-controls" aria-label="Game controls">
          <button data-action="rotate" type="button" aria-label="Rotate">⟳</button>
          <button data-action="left" type="button" aria-label="Left">◀</button>
          <button data-action="down" type="button" aria-label="Down">▼</button>
          <button data-action="right" type="button" aria-label="Right">▶</button>
          <button data-action="drop" type="button" aria-label="Hard drop">⤓</button>
        </div>

        <p class="tetris-controls-hint">← → move · ↑ rotate · ↓ soft drop · Space hard drop · P pause</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/pixel-art.js"></script>
  <script src="../js/background-characters.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/tetris.js"></script>
</body>
</html>
