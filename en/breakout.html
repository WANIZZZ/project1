<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2656200620663831"
       crossorigin="anonymous"></script>
  <title>Brick Breaker - PixelCraft Studio</title>
  <meta name="description" content="Play a classic brick breaker game right in your browser. Bounce the ball with your paddle to smash every brick." />
  <meta name="keywords" content="brick breaker, breakout, browser game, free online game, mini game" />
  <link rel="canonical" href="https://pixelcraftstudio-2cd.pages.dev/en/breakout.html" />
  <link rel="alternate" hreflang="ko" href="https://pixelcraftstudio-2cd.pages.dev/breakout.html" />
  <link rel="alternate" hreflang="en" href="https://pixelcraftstudio-2cd.pages.dev/en/breakout.html" />
  <link rel="alternate" hreflang="x-default" href="https://pixelcraftstudio-2cd.pages.dev/breakout.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PixelCraft Studio" />
  <meta property="og:title" content="Brick Breaker - PixelCraft Studio" />
  <meta property="og:description" content="Play a classic brick breaker game right in your browser, no install required." />
  <meta property="og:url" content="https://pixelcraftstudio-2cd.pages.dev/en/breakout.html" />
  <meta property="og:locale" content="en_US" />

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <h1>Brick Breaker</h1>
      <p>
        Bounce the ball with your paddle to smash every brick - the
        classic arcade game. Head back to the <a href="games.html">mini
        games list</a> any time.
      </p>
    </section>

    <div class="game-layout">
      <div class="canvas-board-wrap">
        <canvas id="breakout-board" width="320" height="480" aria-label="Brick breaker board"></canvas>
        <div id="breakout-overlay" class="game-overlay" hidden>
          <p id="breakout-overlay-text"></p>
          <button id="breakout-restart-btn" class="btn btn-primary" type="button">Restart</button>
        </div>
      </div>

      <div class="game-panel">
        <div class="game-stat-row">
          <div class="game-stat">
            <span class="game-stat-label">Score</span>
            <span id="breakout-score" class="game-stat-value">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">Lives</span>
            <span id="breakout-lives" class="game-stat-value">3</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">Bricks</span>
            <span id="breakout-bricks" class="game-stat-value">40</span>
          </div>
        </div>

        <button id="breakout-pause-btn" class="btn btn-secondary" type="button">Pause</button>

        <div class="game-touch-controls breakout-dpad" aria-label="Game controls">
          <button data-action="left" type="button" aria-label="Left">◀</button>
          <button data-action="launch" type="button" aria-label="Launch">●</button>
          <button data-action="right" type="button" aria-label="Right">▶</button>
        </div>

        <p class="game-controls-hint">← → move · Space launch · P pause</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/pixel-art.js"></script>
  <script src="../js/background-characters.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/breakout.js"></script>
</body>
</html>
