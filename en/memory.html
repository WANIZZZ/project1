<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2656200620663831"
       crossorigin="anonymous"></script>
  <title>Memory Match - PixelCraft Studio</title>
  <meta name="description" content="Play a memory matching card game using PixelCraft Studio's original pixel icons - right in your browser." />
  <meta name="keywords" content="memory match, card matching game, browser game, free online game, mini game" />
  <link rel="canonical" href="https://pixelcraftstudio-2cd.pages.dev/en/memory.html" />
  <link rel="alternate" hreflang="ko" href="https://pixelcraftstudio-2cd.pages.dev/memory.html" />
  <link rel="alternate" hreflang="en" href="https://pixelcraftstudio-2cd.pages.dev/en/memory.html" />
  <link rel="alternate" hreflang="x-default" href="https://pixelcraftstudio-2cd.pages.dev/memory.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PixelCraft Studio" />
  <meta property="og:title" content="Memory Match - PixelCraft Studio" />
  <meta property="og:description" content="A card matching memory game using PixelCraft Studio's original pixel icons." />
  <meta property="og:url" content="https://pixelcraftstudio-2cd.pages.dev/en/memory.html" />
  <meta property="og:locale" content="en_US" />

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <h1>Memory Match</h1>
      <p>
        Flip cards two at a time to find every matching pair. The card
        artwork is PixelCraft Studio's own original pixel icons. Head
        back to the <a href="games.html">mini games list</a> any time.
      </p>
    </section>

    <div class="game-layout">
      <div class="memory-board-wrap">
        <div id="memory-grid" class="memory-grid" aria-label="Memory match board"></div>
        <div id="memory-overlay" class="game-overlay" hidden>
          <p id="memory-overlay-text"></p>
        </div>
      </div>

      <div class="game-panel">
        <div class="game-stat-row">
          <div class="game-stat">
            <span class="game-stat-label">Moves</span>
            <span id="memory-moves" class="game-stat-value">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">Matches</span>
            <span id="memory-matches" class="game-stat-value">0/8</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">Time</span>
            <span id="memory-time" class="game-stat-value">0:00</span>
          </div>
        </div>

        <button id="memory-restart-btn" class="btn btn-primary" type="button">New Game</button>

        <p class="game-controls-hint">Click two cards at a time to find matching pairs.</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/pixel-art.js"></script>
  <script src="../js/background-characters.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pixel-gallery-icons.js"></script>
  <script src="../js/memory.js"></script>
</body>
</html>
