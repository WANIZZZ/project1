<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2656200620663831"
       crossorigin="anonymous"></script>
  <title>벽돌깨기 - 픽셀크래프트 스튜디오</title>
  <meta name="description" content="브라우저에서 바로 즐기는 클래식 벽돌깨기 게임입니다. 패들로 공을 튕겨 모든 벽돌을 깨보세요." />
  <meta name="keywords" content="벽돌깨기, 브레이크아웃, 브라우저 게임, 무료 온라인 게임, 미니 게임" />
  <link rel="canonical" href="https://pixelcraftstudio-2cd.pages.dev/breakout.html" />
  <link rel="alternate" hreflang="ko" href="https://pixelcraftstudio-2cd.pages.dev/breakout.html" />
  <link rel="alternate" hreflang="en" href="https://pixelcraftstudio-2cd.pages.dev/en/breakout.html" />
  <link rel="alternate" hreflang="x-default" href="https://pixelcraftstudio-2cd.pages.dev/breakout.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="픽셀크래프트 스튜디오" />
  <meta property="og:title" content="벽돌깨기 - 픽셀크래프트 스튜디오" />
  <meta property="og:description" content="설치 없이 브라우저에서 바로 즐기는 클래식 벽돌깨기." />
  <meta property="og:url" content="https://pixelcraftstudio-2cd.pages.dev/breakout.html" />
  <meta property="og:locale" content="ko_KR" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <h1>벽돌깨기</h1>
      <p>
        패들로 공을 튕겨 모든 벽돌을 깨는 클래식 아케이드 게임입니다.
        <a href="games.html">미니 게임 목록</a>으로 돌아가려면 이 링크를
        이용하세요.
      </p>
    </section>

    <div class="game-layout">
      <div class="canvas-board-wrap">
        <canvas id="breakout-board" width="320" height="480" aria-label="벽돌깨기 보드"></canvas>
        <div id="breakout-overlay" class="game-overlay" hidden>
          <p id="breakout-overlay-text"></p>
          <button id="breakout-restart-btn" class="btn btn-primary" type="button">다시 시작</button>
        </div>
      </div>

      <div class="game-panel">
        <div class="game-stat-row">
          <div class="game-stat">
            <span class="game-stat-label">점수</span>
            <span id="breakout-score" class="game-stat-value">0</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">생명</span>
            <span id="breakout-lives" class="game-stat-value">3</span>
          </div>
          <div class="game-stat">
            <span class="game-stat-label">벽돌</span>
            <span id="breakout-bricks" class="game-stat-value">40</span>
          </div>
        </div>

        <button id="breakout-pause-btn" class="btn btn-secondary" type="button">일시정지</button>

        <div class="game-touch-controls breakout-dpad" aria-label="게임 조작 버튼">
          <button data-action="left" type="button" aria-label="왼쪽">◀</button>
          <button data-action="launch" type="button" aria-label="발사">●</button>
          <button data-action="right" type="button" aria-label="오른쪽">▶</button>
        </div>

        <p class="game-controls-hint">← → 이동 · Space 발사 · P 일시정지</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/pixel-art.js"></script>
  <script src="js/background-characters.js"></script>
  <script src="js/common.js"></script>
  <script src="js/breakout.js"></script>
</body>
</html>
